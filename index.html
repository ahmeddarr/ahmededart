.dz-rbot{display:grid;place-items:center;min-height:0;margin-top:1cqh}

.dz-act{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:#e8fbff;font-weight:800;font-size:clamp(11px,1.7vh,14px);cursor:pointer}

/* شاشة عمودية (جهاز لوحي موضوع أفقيًا على طاولة) */

.dz{grid-template-columns:1fr;grid-template-rows:1fr 1fr}

}
/* ============ تحسينات تصميم عامة للتطبيق ============ */

.sidebar{background:linear-gradient(180deg,rgba(14,22,70,.96),rgba(5,8,28,.97));box-shadow:-10px 0 40px rgba(2,6,26,.6),inset 1px 0 0 rgba(255,255,255,.04)}

/* ============ اتجاه الكتابة: من اليمين إلى اليسار في كل الأقسام ============
   لعكس ترتيب المعادلات إلى اليسار→اليمين (٥ × ٣ = ١٥) غيّر القيمة التالية إلى ltr */
:root{--eq-dir:rtl}
html,body,#root,#app-root{direction:rtl}
.eq,.learn-op{direction:var(--eq-dir)}

/* ============ تصميم الإنجاز الفردي (نفس هوية التحدي الجماعي) ============ */
.sz{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto auto minmax(0,1fr);direction:rtl;container-type:size;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;animation:dzIn .5s ease both;--skipw:clamp(70px,19cqh,170px);--brick:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='360'%20height='150'%3E%3Cg%20fill='%23fff'%20fill-opacity='.04'%3E%3Crect%20x='3'%20y='3'%20width='177'%20height='70'/%3E%3Crect%20x='271'%20y='78'%20width='89'%20height='70'/%3E%3Crect%20x='0'%20y='78'%20width='88'%20height='70'/%3E%3C/g%3E%3Cg%20fill='%23fff'%20fill-opacity='.07'%3E%3Crect%20x='3'%20y='3'%20width='177'%20height='1.5'/%3E%3Crect%20x='183'%20y='3'%20width='177'%20height='1.5'/%3E%3Crect%20x='91'%20y='78'%20width='177'%20height='1.5'/%3E%3Crect%20x='0'%20y='78'%20width='88'%20height='1.5'/%3E%3Crect%20x='271'%20y='78'%20width='89'%20height='1.5'/%3E%3C/g%3E%3Cg%20fill='%23000'%20fill-opacity='.34'%3E%3Crect%20x='0'%20y='73'%20width='360'%20height='4'/%3E%3Crect%20x='0'%20y='146'%20width='360'%20height='4'/%3E%3Crect%20x='0'%20y='0'%20width='3'%20height='73'/%3E%3Crect%20x='180'%20y='0'%20width='3'%20height='73'/%3E%3Crect%20x='88'%20y='77'%20width='3'%20height='69'/%3E%3Crect%20x='268'%20y='77'%20width='3'%20height='69'/%3E%3C/g%3E%3C/svg%3E");background:radial-gradient(120% 100% at 50% 42%,#2f46cf 0%,transparent 72%),var(--brick),linear-gradient(180deg,#101d74,#050b32)}
.sz:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 52%,rgba(0,0,0,.58) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.016) 0 1px,transparent 1px 4px)}

/* الشريط العلوي: خروج | النتيجة والوقت | عدّادات صغيرة */
.sz-bar{position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"exit stats side";align-items:center;gap:clamp(8px,1.6cqw,24px);padding:clamp(6px,1.5cqh,14px) clamp(12px,2.4cqw,36px);background:#000;border-bottom:1px solid rgba(40,230,255,.4);box-shadow:0 4px 26px rgba(0,0,0,.65),0 2px 22px rgba(40,230,255,.22)}

.sz-stat-l{font-size:.55em;opacity:.95}

.sz-score{color:#fff;border-color:#3dff8a;box-shadow:0 0 .55em #3dff8aaa,0 0 1.4em #3dff8a55,inset 0 0 .6em #3dff8a44;text-shadow:0 0 .4em #3dff8a88}
.sz-time{color:#fff;border-color:#ff3fd8;box-shadow:0 0 .55em #ff3fd8aa,0 0 1.4em #ff3fd855,inset 0 0 .6em #ff3fd844;text-shadow:0 0 .4em #ff3fd888}
.sz-time.low{animation:szLow .5s ease-in-out infinite alternate}
@keyframes szLow{to{color:#ffe3f8;transform:scale(1.05);box-shadow:0 0 .9em #ff3fd8,0 0 2.4em #ff3fd8aa,inset 0 0 .8em #ff3fd866}}
.sz-side{grid-area:side;justify-self:end;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px}
.sz-chip{display:inline-flex;align-items:center;gap:.4em;padding:.18em .8em;border-radius:99px;border:2px solid;font-weight:900;font-size:clamp(13px,3.2cqh,26px);background:rgba(2,8,26,.6);white-space:nowrap}
.sz-chip svg{width:1em;height:1em}

.sz-chip.streak{display:none;color:#ffd23f;border-color:#ffd23f99;background:rgba(255,160,0,.14);box-shadow:0 0 14px #ffb30055;animation:dzFlame 1s ease-in-out infinite alternate}

/* الجسم: عنوان + (معادلة + لوحة) + الروبوت */
.sz-body{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) var(--botw);grid-template-rows:auto minmax(0,1fr);--botw:clamp(120px,21cqw,300px);gap:clamp(4px,1.2cqh,16px) clamp(8px,1.6cqw,24px);padding:clamp(6px,1.6cqh,20px) clamp(14px,2.6cqw,40px) clamp(12px,2.8cqh,34px);min-height:0}
.sz-title{grid-column:1/-1;text-align:center;line-height:1.15}
.sz-title h2{margin:0;font-family:var(--font-num);font-weight:800;font-size:clamp(20px,6.4cqh,60px);color:#aef6ff;text-shadow:0 0 .3em #28e6ff,0 0 .8em #28e6ffaa,0 0 1.6em #28e6ff66}
.sz-sub{margin-top:.15em;font-weight:700;font-size:clamp(11px,2.4cqh,20px);color:#a9c9ff;opacity:.95}
.sz-play{grid-column:1;grid-row:2;position:relative;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"eq" "pad";gap:clamp(6px,1.6cqh,22px)}
.sz-eqrow{grid-area:eq;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;padding-inline-start:calc(var(--skipw) + 1.5cqw)}
.sz-skipcell{grid-area:eq;justify-self:start;align-self:center;z-index:3}
.sz .dz-skip{width:var(--skipw);font-size:clamp(14px,4cqh,38px)}
.sz-eq{direction:var(--eq-dir);display:flex;align-items:center;justify-content:center;gap:.2em;font-weight:900;color:#fff;font-size:clamp(40px,min(19cqh,9cqw),230px);line-height:1;white-space:nowrap;text-shadow:0 0 16px rgba(255,255,255,.55),0 0 46px rgba(40,230,255,.55)}
.sz-toast-slot{position:absolute;inset-inline:0;bottom:-5%;display:grid;place-items:center;pointer-events:none;z-index:4}
.sz .dz-toast{font-size:clamp(16px,4.8cqh,46px)}

/* لوحة الأرقام: ممحاة | ١–٥ / ٦–٠ | إدخال (من اليمين إلى اليسار) */
.sz-pad{grid-area:pad;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,5.2fr) minmax(0,1fr);grid-template-areas:"del keys go";gap:clamp(8px,1.6cqw,22px);height:clamp(130px,34cqh,360px);min-height:0}
.sz-keys{grid-area:keys;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(6px,1.2cqw,16px)}
.sz-pad>.dz-k.del{grid-area:del}
.sz-pad>.dz-k.go{grid-area:go}
.sz .dz-k{font-size:clamp(22px,min(8.2cqh,5.4cqw),96px)}
.sz-pad.mc{grid-template-columns:minmax(0,1fr);grid-template-areas:"opts"}
.sz-opts{grid-area:opts;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(8px,1.6cqw,20px);min-height:0}
.sz .sz-opt{font-size:clamp(26px,min(11cqh,7cqw),110px)}
.sz-opt.ok{border-color:#7dffb0;background:linear-gradient(160deg,#19cf6c,#087a3a);color:#fff;text-shadow:none;box-shadow:0 0 18px #3dff8aaa,0 0 42px #3dff8a55,inset 0 0 22px #b6ffd444}
.sz-opt.bad{border-color:#ff7a90;background:linear-gradient(160deg,#d3213b,#7a0d20);color:#fff;text-shadow:none;box-shadow:0 0 18px #ff5470aa,0 0 42px #ff547055,inset 0 0 22px #ff9aa844}
.sz-opt:disabled{cursor:default}

/* الروبوت «نجم» (يسار الشاشة في الوضع الأفقي) */
.sz-bot{grid-column:2;grid-row:2;align-self:end;justify-self:center;display:grid;justify-items:center;min-width:0;pointer-events:none}

/* هواتف بعرض ضيّق أو شاشة عمودية */
@media (orientation:portrait){
.sz-bar{grid-template-columns:auto minmax(0,1fr);grid-template-areas:"exit stats" "side side";row-gap:6px}
.sz-stats{justify-self:center}
.sz-side{justify-self:center;justify-content:center}
.sz-stat{min-width:clamp(86px,27cqw,170px);font-size:clamp(14px,4cqw,30px)}
.sz-chip{font-size:clamp(12px,3.2cqw,22px)}
.sz-exit{width:clamp(40px,10cqw,60px);height:clamp(40px,10cqw,60px)}

.sz-title{grid-area:title}
.sz-title h2{font-size:clamp(18px,5.6cqw,44px)}
.sz-sub{font-size:clamp(11px,3cqw,18px)}
.sz-play{display:contents}
.sz-eqrow{grid-area:eq;padding-inline-start:0}
.sz-eq{font-size:clamp(38px,min(19cqh,13.4cqw),200px)}
.sz-skipcell{grid-area:aux;justify-self:start;align-self:center}
.sz .dz-skip{font-size:clamp(13px,3.4cqw,26px)}
.sz-bot{grid-area:aux;justify-self:end;align-self:center}
.sz-bot .bubble-holder{position:absolute;left:100%;top:50%;transform:translateY(-50%);width:max-content;max-width:52cqw;z-index:5}
.sz-bot .bubble{margin:0 0 0 8px}
.sz-bot .bubble:after{display:none}
.sz-pad{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"keys keys" "del go";grid-template-rows:minmax(0,2fr) minmax(0,1fr);height:clamp(210px,40cqh,380px)}
.sz .dz-k{font-size:clamp(20px,min(6.4cqh,8cqw),70px)}
.sz .sz-opt{font-size:clamp(24px,min(8cqh,12cqw),90px)}
.sz-opts{grid-template-rows:repeat(2,minmax(0,1fr))}
}
@media (orientation:landscape) and (max-height:430px){
.sz-sub{display:none}
.sz-title h2{font-size:clamp(16px,5.4cqh,30px)}
}

/* ============ مساعدة: بقية الواجهة RTL ============ */
.sz *{-webkit-tap-highlight-color:transparent}


/* ============ طبقة حماية (رادعة) — تمنع النسخ العرضي وتكشف فتح أدوات المطوّر ============ */
html,body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable="true"]{-webkit-user-select:text!important;-moz-user-select:text!important;user-select:text!important}
img,svg{-webkit-user-drag:none;user-drag:none}
.adv-overlay{position:fixed;inset:0;z-index:99999;display:none;place-items:center;padding:24px;text-align:center;background:radial-gradient(900px 520px at 50% 0%,rgba(162,89,255,.25),transparent 60%),rgba(3,6,18,.97);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fadeIn .25s}
.adv-overlay.on{display:grid}
.adv-box{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:14px}
.adv-ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:rgba(255,84,112,.14);border:2px solid rgba(255,84,112,.6);color:#ff97a9;box-shadow:0 0 30px rgba(255,84,112,.35)}
.adv-ic svg{width:36px;height:36px}
.adv-box h2{margin:0;font-size:clamp(18px,3vh,24px);color:#fff}
.adv-box p{margin:0;font-weight:700;line-height:1.8;color:#a9c4ff;font-size:clamp(13px,2vh,15.5px)}

</style>
  <script>
(function(){
"use strict";
/* عوائق ردع بسيطة — ليست حماية مطلقة، لأن أي كود يصل للمتصفح يمكن قراءته تقنيًا،
   لكنها تمنع غالبية محاولات النسخ أو فتح أدوات المطوّر عبر الطرق الشائعة. */
document.addEventListener("contextmenu",function(e){e.preventDefault()});
document.addEventListener("dragstart",function(e){e.preventDefault()});
document.addEventListener("copy",function(e){
var t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;e.preventDefault()});
document.addEventListener("keydown",function(e){
var k=e.key,code=e.code,ctrl=e.ctrlKey||e.metaKey;
if(k==="F12"||(ctrl&&e.shiftKey&&["I","J","C","K","i","j","c","k"].indexOf(k)>-1)||(ctrl&&(k==="u"||k==="U"||k==="s"||k==="S"))||(code==="F12")){
e.preventDefault();e.stopPropagation()}},true);
var box,hits=0,clear=0;
function overlay(){
if(box)return box;
box=document.createElement("div");box.className="adv-overlay";
box.innerHTML='<div class="adv-box"><div class="adv-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><h2>المحتوى محمي</h2><p>تم إيقاف العرض مؤقتًا لأن أدوات المطوّر مفتوحة.<br>أغلقها للمتابعة.</p></div>';
document.body.appendChild(box);return box}
function show(){overlay().classList.add("on")}
function hide(){box&&box.classList.remove("on")}
var fine=window.matchMedia&&window.matchMedia("(pointer:fine)").matches;
function sizeCheck(){
if(!fine)return false;
return (window.outerWidth-window.innerWidth>160)||(window.outerHeight-window.innerHeight>160)}
var probe={};
Object.defineProperty(probe,"id",{get:function(){hits+=2;return""}});
function consoleCheck(){try{console.log("%c",probe);console.clear()}catch(e){}}
setInterval(function(){
consoleCheck();
if(sizeCheck())hits++;
if(hits>0){hits=0;clear=0;show()}
else{clear++;if(clear>=2)hide()}
},700);
})();
</script>
