<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مُهَنْدِسُ الزَّوَايَا الصَّغِيرُ</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#12304f;--b:#1e3a8a;--or:#f59e0b;--gr:#16a34a;--btn:#e0f2fe;--btnink:#0c4a6e;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--btn:#334155;--btnink:#e2e8f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--btn:#334155;--btnink:#e2e8f0;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--b);color:var(--ink);font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;font-size:clamp(14px,1.7vw,21px)}
#app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:8px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--b);color:#fff;overflow:hidden}
header h1{margin:0;font-size:1.05em;white-space:nowrap}header small{opacity:.85;white-space:nowrap}header .sp{flex:1}
button{font:inherit;border:0;border-radius:14px;padding:.35em .7em;min-height:44px;background:var(--card);color:var(--ink);box-shadow:0 2px 5px #0003;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button.on{background:var(--or)!important;color:#222!important}
header button{min-width:44px;padding:.2em .6em}
.hide{display:none!important}
#nav{display:flex;gap:8px;padding:6px 12px;overflow-x:auto;align-items:center;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
#nav button{flex:none;font-weight:700}#nav .m{background:#ddd6fe;color:#312e81;font-size:.85em}#nav .md{background:var(--b);color:#fff}
main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,1fr);gap:10px;padding:4px 12px 10px;min-height:0}
@media(max-aspect-ratio:1/1){main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}}
#left{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
#board{flex:1;min-height:0;min-width:0;background:#fff;border:2px solid #bfdbfe;border-radius:18px;box-shadow:0 3px 12px #0002;overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#g,#pr,#ink,#t{pointer-events:none}body.prac #t{pointer-events:auto}
#tb{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none}
#tb button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;line-height:1.1;padding:.25em .4em}
#tb .ic{font-size:1.5em}#tb small{font-size:.68em;font-weight:700}
#panel{background:var(--card);border-radius:18px;box-shadow:0 3px 12px #0002;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
#bubble{flex:1;min-height:4em;overflow:auto;background:#fef3c7;color:#422006;border-radius:16px;padding:10px 12px;line-height:1.65;font-size:clamp(18px,2.4vw,30px);font-weight:700;display:flex;gap:8px;align-items:flex-start}
#bubble b{font-size:1.2em;line-height:1}
#msg{min-height:1.5em;font-weight:700;color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row button{background:var(--btn);color:var(--btnink)}
#bnext{grid-column:span 2;background:var(--gr);color:#fff;font-weight:700;font-size:1.1em}
@media(max-aspect-ratio:1/1){#bubble{flex:none;max-height:22vh}#panel{max-height:36vh}}
@media(max-height:520px){header small{display:none}}
/* svg */
.main{stroke:#0044ff;stroke-width:4;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 2px #00d4ff) drop-shadow(0 0 6px #00a2ff)}
.cons{stroke:#b100ff;stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 2px #e879f9) drop-shadow(0 0 5px #c026d3)}
.free{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dot{fill:#0369a1}.lb{font-size:24px;font-weight:700;fill:#12304f;paint-order:stroke;stroke:#fff;stroke-width:4px}
.wedge{fill:#f59e0b;fill-opacity:.28;stroke:#d97706;stroke-width:2}.ml{font-size:22px;font-weight:700;fill:#b45309}
.sq{fill:none;stroke:#00e676;stroke-width:4;filter:drop-shadow(0 0 5px #00e676)}
.fin .cons,.fin .pc{display:none}
@keyframes pl{50%{r:30;opacity:.4}}.ring{fill:none;stroke:var(--or);stroke-width:5;animation:pl 1s infinite}
</style></head>
<body><div id="app">
<header><h1>📐 مُهَنْدِسُ الزَّوَايَا الصَّغِيرُ</h1><small>الدرس السابع: أبني زوايا أقيسها بالدرجة</small><span class="sp"></span><b id="prog">—</b>
<button id="home" title="الرئيسية">🏠</button><button id="snd" title="الصوت">🔇</button><button id="fs" title="ملء الشاشة">⛶</button></header>
<div id="nav"></div>
<main><div id="left"><div id="board"><svg id="s" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet"><g id="g"></g><g id="pr"></g><g id="ink"></g><g id="t"></g></svg></div>
<div id="tb" class="hide"><button data-t="pen"><span class="ic">✏️</span><small>قلم</small></button><button data-t="pt"><span class="ic">📍</span><small>نقطة</small></button><button data-t="r"><span class="ic">📏</span><small>مسطرة</small></button><button data-t="c"><span class="ic">🧭</span><small>بركار</small></button><button data-t="g"><span class="ic">📐</span><small>منقلة</small></button><button id="bundo"><span class="ic">↩️</span><small>تراجع</small></button><button id="bclr"><span class="ic">🗑️</span><small>مسح</small></button></div></div>
<div id="panel"><div id="bubble"><b>🧑‍🔧</b><span id="txt"></span></div><div id="msg"></div>
<div class="row" id="cl"><button id="bnext">التالية ◀</button><button id="bprev">▶ السابقة</button><button id="brep">🔁 أعد الحركة</button><button id="bwatch">▶️ شاهد الرسم</button><button id="bres">↺ ابدأ من جديد</button><button id="bspd">🚶 عادي</button><button id="bpr" class="on">📏 المنقلة</button><button id="bview">🧩 النتيجة فقط</button></div>
<div class="row hide" id="cpr"><button id="bchk" style="grid-column:span 2;background:var(--gr);color:#fff;font-weight:700;font-size:1.1em">🎯 تحقّق من رسمي</button><button id="bhint">💡 تلميح</button><button id="bhelp">❓ كيف أستعمل الأدوات؟</button></div></div></main></div>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',D=Math.PI/180,$=s=>document.querySelector(s);
/* ===== محرك هندسي ===== */
const pol=(c,r,a)=>({x:c.x+r*Math.cos(a*D),y:c.y-r*Math.sin(a*D)});
const ang=(c,p)=>Math.atan2(c.y-p.y,p.x-c.x)/D, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function inter(c1,r1,c2,r2){const d=dist(c1,c2),a=(r1*r1-r2*r2+d*d)/(2*d),h=Math.sqrt(Math.max(0,r1*r1-a*a)),ux=(c2.x-c1.x)/d,uy=(c2.y-c1.y)/d,mx=c1.x+a*ux,my=c1.y+a*uy;return[{x:mx+h*uy,y:my-h*ux},{x:mx-h*uy,y:my+h*ux}]}
const ext=(a,b,L)=>{const d=dist(a,b);return{x:a.x+(b.x-a.x)*L/d,y:a.y+(b.y-a.y)*L/d}};
const LN=(p,q,o={})=>({k:'l',p,q,...o}),AR=(c,r,a0,a1)=>({k:'a',c,r,a0,a1}),PT=(p,n,o={})=>({k:'p',p,n,...o}),
AN=(v,a0,a1,r,t)=>({k:'n',v,a0,a1,r,t}),SQ=(v,a0,a1)=>({k:'s',v,a0,a1});
const around=(c,r,p,w=14)=>AR(c,r,ang(c,p)-w,ang(c,p)+w);
const arcD=(c,r,a0,a1)=>{const p=pol(c,r,a0),q=pol(c,r,a1);return`M${p.x} ${p.y}A${r} ${r} 0 ${a1-a0>180?1:0} 0 ${q.x} ${q.y}`};
/* ===== بيانات الدروس ===== */
const A0={x:300,y:450},B0={x:680,y:450},EN={x:760,y:450};
const nearest=(l,t)=>l.sort((x,y)=>dist(x,t)-dist(y,t))[0];
function right1(A){const B={x:A.x+380,y:A.y},Dd={x:A.x-110,y:A.y},E={x:A.x+110,y:A.y},F=inter(Dd,170,E,170).sort((a,b)=>a.y-b.y)[0];
return[{t:'نرسم نصف المستقيم [أ ب) بالمسطرة.',o:[LN(A,EN,{m:1}),PT(A,'أ'),PT(B,'ب')]},
{t:'نمدّد المستقيم إلى جهة أ. بالبركار (مركزه أ) نعيّن على المستقيم نقطتين د و ه على بعدين متساويين من أ، فنحصل على القطعة [د ه].',o:[LN(A,{x:A.x-150,y:A.y},{m:1}),AR(A,110,-25,25),AR(A,110,155,205),PT(Dd,'د',{c:1}),PT(E,'ه',{c:1})]},
{t:'نبني المتوسط العمودي للقطعة [د ه]: قوسان بنفس الفتحة مركزاهما د و ه يتقاطعان في و. نرسم (أ و) فنحصل على زاوية قائمة.',o:[around(Dd,170,F,15),around(E,170,F,15),PT(F,'و',{c:1}),LN(A,{x:A.x,y:110},{m:1}),SQ(A,0,90)]}]}
function bis(A,a,b,r,k,t){const P=pol(A,r,a),Q=pol(A,r,b),R=inter(P,k,Q,k).sort((x,y)=>dist(y,A)-dist(x,A))[0],m=ang(A,R);
return{t,o:[AR(A,r,a-10,b+10),PT(P,'',{c:1}),PT(Q,'',{c:1}),around(P,k,R,13),around(Q,k,R,13),PT(R,'',{c:1}),LN(A,ext(A,R,380),{m:1}),AN(A,a,m,r*.5,(m-a)+'°'),AN(A,m,b,r*.5,(b-m)+'°')]}}
function s60(A,th,d,r,t2,t3,nm){const P=pol(A,r,th),Q=nearest(inter(A,r,P,r),pol(A,r,th+60*d)),q=ang(A,Q),lo=Math.min(th,th+60*d),hi=Math.max(th,th+60*d);
return[{t:t2,o:[around(A,r,Q),around(P,r,Q),PT(Q,nm)]},{t:t3,o:[LN(A,ext(A,Q,380),{m:1}),AN(A,lo,hi,60,'60°')]}]}
const ray=(t,extra=[])=>({t,o:[LN({x:140,y:450},EN,{m:1}),PT(A0,'أ'),PT(B0,'ب'),...extra]});
const T2='نأخذ البركار ونعيّن فتحة قيسها [أ ب]، ثم نرسم قوسًا مركزه أ وقوسًا مركزه ب بنفس الفتحة، فيتقاطعان في ج.',T3='نربط ج بالنقطة أ فنحصل على زاوية قيس فتحتها 60°.';
const a60=()=>[ray('نرسم المستقيم Δ ونعيّن عليه القطعة [أ ب].',[PT({x:710,y:425},'Δ',{nd:1})]),...s60(A0,0,1,380,T2,T3,'ج')];
const A2={x:200,y:450},C2={x:320,y:300},r2=dist(A2,C2),K2={x:440,y:450},M2={x:2*C2.x-K2.x,y:2*C2.y-K2.y};
const L={
15:{m:[{s:[...a60(),bis(A0,0,60,150,95,'نبني منصف الزاوية 60° بالبركار: قوس مركزه أ يقطع الضلعين، ثم قوسان بنفس الفتحة من نقطتي التقاطع يلتقيان. نحصل على زاويتين قيس كل واحدة 30°.'),bis(A0,0,30,200,70,'نبني منصف إحدى زاويتي 30°: نحصل على زاويتين قيس كل واحدة 15°.')]}]},
30:{m:[{s:[...a60(),bis(A0,0,60,150,95,'نبني منصف الزاوية 60° فنحصل على زاويتين متقايستين قيس كل واحدة 30°.')]}]},
45:{m:[{s:[...right1(A0),bis(A0,0,90,120,110,'نبني منصف الزاوية القائمة: نحصل على زاويتين متقايستين قيس كل واحدة 45°.')]}]},
60:{m:[{s:a60()}]},
90:{m:[{n:'الطريقة 1',s:right1(A0)},{n:'الطريقة 2',s:[
{t:'نرسم نصف المستقيم [أ ب) ونعيّن نقطة ج لا تنتمي إليه.',o:[LN(A2,{x:760,y:450},{m:1}),PT(A2,'أ'),PT({x:600,y:450},'ب'),PT(C2,'ج')]},
{t:'نرسم الدائرة د مركزها ج وشعاعها [ج أ] (تمرّ بالنقطة أ)، فتقطع [أ ب) في ك.',o:[AR(C2,r2,0,359.9),PT(K2,'ك')]},
{t:'نرسم المستقيم (ك ج) الذي يقطع الدائرة د في النقطة م.',o:[LN(K2,M2),PT(M2,'م')]},
{t:'نرسم نصف المستقيم [أ م) فنحصل على الزاوية القائمة (زاوية محاطة تقابل قطرًا).',o:[LN(A2,ext(A2,M2,360),{m:1}),SQ(A2,0,90)]}]}]},
120:{m:[{n:'الطريقة 1',s:[...a60(),
{t:'نبني زاوية مجاورة قيس فتحتها 60° لها الضلع [أ ج) نفسه والرأس أ نفسه: قوس مركزه أ وقوس مركزه ج بنفس الفتحة يتقاطعان في د.',o:(()=>{const P=pol(A0,380,60),Q=nearest(inter(A0,380,P,380),pol(A0,380,120));return[around(A0,380,Q),around(P,380,Q),PT(Q,'د')]})()},
{t:'نرسم [أ د) فتصبح الزاوية الكاملة 60° + 60° = 120°.',o:[LN(A0,ext(A0,pol(A0,380,120),380),{m:1}),AN(A0,60,120,45,'60°'),AN(A0,0,120,90,'120°')]}]},
{n:'الطريقة 2',s:[
{t:'نرسم زاوية منبسطة (180°) رأسها أ: المستقيم يمرّ بالنقطة أ.',o:[LN({x:110,y:450},EN,{m:1}),PT(A0,'أ'),PT(B0,'ب'),AN(A0,0,180,40,'180°')]},
...s60(A0,180,-1,190,'نبني زاوية 60° مع الضلع الأيسر لنفس الرأس: قوسان بنفس الفتحة يتقاطعان في ج.','نرسم [أ ج). الزاوية المتبقية: 180° − 60° = 120°.','ج').map((s,i)=>i?{t:s.t,o:[...s.o,AN(A0,0,120,95,'120°')]}:s)]}]}
};

/* ===== الحالة ===== */
const svg=$('#s'),G=$('#g'),PR=$('#pr'),INK=$('#ink'),T=$('#t');
let cur=60,mi=0,n=0,ci=0,tok=0,auto=false,busy=false,vo=false,showPr=true,mode='learn',spi=1,rs=null,cs=null,CLG=200,hintI=0,dm='pen',lastT='r',drag=null,ink=null;
const SPEEDS=[['🐢 بطيء',2.3],['🚶 عادي',1.5],['🐇 سريع',1]],SP=()=>SPEEDS[spi][1],AC={},ptrs=new Map(),OBJ=[];
const RL={on:false,x:90,y:70,a:0,L:430},CP={on:false,C:{x:300,y:330},r:140,th:15},PRO={on:false,x:400,y:430,a:0},PR_R=150;
const LAB=['أ','ب','ج','د','ه','و','ز','ح','ط','ي','ك','ل','م','ن'];
const meth=()=>L[cur].m[mi],steps=()=>meth().s,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const E=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const msg=t=>$('#msg').textContent=t;
const Q=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
function say(t){if(!vo||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u)}
function tween(ms,f,my){return new Promise(res=>{const t0=performance.now();(function s(t){if(my!=tok){res(false);return}const u=Math.min(1,(t-t0)/ms);f(u*u*(3-2*u));u<1?requestAnimationFrame(s):res(true)})(t0)})}
/* ===== رسم العناصر ===== */
function mk(o,st){let e;
if(o.k=='l'||o.k=='a'){e=E('path',{d:o.k=='l'?`M${o.p.x} ${o.p.y}L${o.q.x} ${o.q.y}`:arcD(o.c,o.r,o.a0,o.a1),pathLength:1,class:o.m?'main':'cons'});e.style.strokeDasharray=1;e.style.strokeDashoffset=st?0:1}
else if(o.k=='p'){e=E('g',{class:o.c?'pc':''});if(!o.nd)e.append(E('circle',{cx:o.p.x,cy:o.p.y,r:6,class:'dot'}));const t=E('text',{x:o.p.x+10,y:o.p.y-12,class:'lb'});t.textContent=o.n;e.append(t)}
else if(o.k=='n'){e=E('g');const p=pol(o.v,o.r,o.a0),q=pol(o.v,o.r,o.a1),m=pol(o.v,o.r+28,(o.a0+o.a1)/2);
e.append(E('path',{d:`M${o.v.x} ${o.v.y}L${p.x} ${p.y}A${o.r} ${o.r} 0 0 0 ${q.x} ${q.y}Z`,class:'wedge'}));const t=E('text',{x:m.x,y:m.y,class:'ml','text-anchor':'middle'});t.textContent=o.t;e.append(t)}
else{const u=pol({x:0,y:0},24,o.a0),w=pol({x:0,y:0},24,o.a1);e=E('path',{d:`M${o.v.x+u.x} ${o.v.y+u.y}L${o.v.x+u.x+w.x} ${o.v.y+u.y+w.y}L${o.v.x+w.x} ${o.v.y+w.y}`,class:'sq'})}
return e}
/* ===== الأدوات (رسوم) ===== */
const LG=()=>mode=='prac'?190:CLG;
function rulerSVG(R,k){const{x,y,a,L:len}=R;let t='';for(let i=20;i<len-10;i+=20)t+=`M${i} 0v${i%100==0?22:12}`;
return`<g transform="translate(${x} ${y}) rotate(${a})"><rect ${k?'data-k="rb" ':''}width="${len}" height="58" rx="6" fill="#fbbf24" fill-opacity=".74" stroke="#b45309" stroke-width="2"/><path d="${t}" stroke="#78350f" stroke-width="2" fill="none" pointer-events="none"/><line x2="${len}" stroke="#7c2d12" stroke-width="3" pointer-events="none"/>${k?`<rect data-k="re" y="-16" width="${len}" height="24" fill="transparent"/><circle data-k="rr" cx="${len-16}" cy="40" r="15" fill="#92400e"/><text x="${len-16}" y="46" text-anchor="middle" fill="#fff" font-size="16" pointer-events="none">⟳</text>`:''}</g>`}
function geo(C,r,th){const Lg=LG();r=Math.max(20,Math.min(r,2*Lg-30));const pen=pol(C,r,th),m={x:(C.x+pen.x)/2,y:(C.y+pen.y)/2},h=Math.sqrt(Lg*Lg-r*r/4),nv=pol({x:0,y:0},1,th+90);return{pen,nv,H:{x:m.x+nv.x*h,y:m.y+nv.y*h}}}
